<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Engine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area">
                <h1>Proposal Engine</h1>
            </div>

            <form id="proposal-form">
                <div class="form-group">
                    <label for="product_name">商品名</label>
                    <input type="text" id="product_name" placeholder="例: 獺祭 磨き二割三分" required>
                </div>

                <div class="form-group">
                    <label for="price">納品価格</label>
                    <input type="text" id="price" placeholder="例: 5,000円" required>
                </div>

                <div class="form-group">
                    <label for="capacity">容量</label>
                    <input type="text" id="capacity" placeholder="例: 720ml" required>
                </div>

                <button type="button" id="search-btn" class="primary-btn">
                    情報・画像を検索
                </button>
            </form>

            <div id="image-selection-area" class="hidden">
                <h2>画像を選択</h2>
                <div id="image-grid" class="image-grid"></div>
                <button type="button" id="generate-btn" class="accent-btn" disabled>
                    提案書を作成
                </button>
            </div>

            <div id="loading-overlay" class="hidden">
                <div class="spinner"></div>
                <p id="loading-text">処理中...</p>
            </div>
        </aside>

        <main class="preview-area">
            <div class="toolbar no-print">
                <button id="list-btn" class="secondary-btn">一覧</button>
                <button id="save-btn" class="secondary-btn" disabled>保存</button>
                <button onclick="window.print()" class="secondary-btn">PDF / 印刷</button>
            </div>

            <div id="proposal-preview" class="a4-container">
                <div class="placeholder-message">
                    左のフォームから商品を検索してください
                </div>
            </div>
        </main>
    </div>

    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="proposals-drawer" class="proposals-drawer">
        <div class="proposals-drawer-header">
            <h2>保存した提案書</h2>
            <button id="drawer-close" class="ghost-btn">閉じる</button>
        </div>
        <div id="proposals-drawer-list" class="proposals-drawer-list"></div>
    </aside>

    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>

</html>
